<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renki — Please stand by</title><style>html,body,#slate{margin:0;width:100%;height:100%;overflow:hidden}.standby-slate {
  --slate-ink: #e9dfb3;
  --slate-paper: #25352b;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  height: 100%;
  min-height: 210px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 5% 7%;
  box-sizing: border-box;
  background: var(--slate-paper);
  color: var(--slate-ink);
  font-family: Georgia, "Times New Roman", serif;
  text-align: center;
  container-type: inline-size;
}
.standby-slate::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  opacity: 0.12;
  background: repeating-linear-gradient(0deg, #0000 0 3px, #000 3px 4px);
}
.slate-band {
  width: 100%;
  border-block: 2px solid currentColor;
  padding: 7px 0;
  font: 700 clamp(9px, 2.2cqw, 22px) / 1.2 monospace;
  letter-spacing: 0.16em;
}
.slate-calibration {
  width: 24%;
  aspect-ratio: 1;
  margin: 3% 0 1%;
  border: 1px solid currentColor;
  background: repeating-conic-gradient(
      from 45deg,
      #e9dfb320 0 25%,
      transparent 0 50%
    )
    0 / 22px 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.slate-orbit {
  width: 82%;
  height: 82%;
  border: 6px double currentColor;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--slate-paper);
}
.slate-mark {
  font:
    italic 900 clamp(44px, 12cqw, 160px) / 0.8 Georgia,
    serif;
  position: relative;
}
.slate-mark span {
  font: normal 20% / 1 monospace;
  position: absolute;
  top: 0;
  right: -0.5em;
}
.slate-message {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.slate-label {
  font: 700 clamp(8px, 1.65cqw, 16px) / 1.3 monospace;
  letter-spacing: 0.22em;
}
.slate-message strong {
  font:
    700 clamp(26px, 7.5cqw, 90px) / 1.1 Georgia,
    serif;
  letter-spacing: -0.04em;
}
.slate-reason {
  font: clamp(12px, 2.8cqw, 28px) / 1.4 monospace;
}
.slate-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  border-top: 1px solid currentColor;
  margin-top: 3%;
  padding-top: 9px;
  font: 700 clamp(7px, 1.5cqw, 15px) / 1.3 monospace;
  letter-spacing: 0.04em;
}
.slate-pulse {
  animation: slate-pulse 3s ease-in-out infinite;
  white-space: nowrap;
}
.slate-registration {
  position: absolute;
  inset: 3%;
  pointer-events: none;
  z-index: -1;
}
.slate-registration i {
  position: absolute;
  width: 14px;
  height: 14px;
  border: 1px solid currentColor;
}
.slate-registration i:nth-child(1) {
  top: 0;
  left: 0;
}
.slate-registration i:nth-child(2) {
  top: 0;
  right: 0;
}
.slate-registration i:nth-child(3) {
  bottom: 0;
  left: 0;
}
.slate-registration i:nth-child(4) {
  bottom: 0;
  right: 0;
}
@keyframes slate-pulse {
  50% {
    opacity: 0.35;
  }
}
@media (prefers-reduced-motion: reduce) {
  .slate-pulse {
    animation: none;
  }
}
